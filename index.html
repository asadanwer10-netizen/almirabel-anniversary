<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Almirabel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 1.5s ease-in-out;
            overflow: hidden;
            text-align: center;
        }

        /* The Interactive Centerpiece */
        #interactive-orb {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease, opacity 0.5s ease;
            animation: float 3s ease-in-out infinite;
            z-index: 10;
            margin: 30px 0;
            -webkit-tap-highlight-color: transparent;
        }

        #interactive-orb:hover {
            transform: scale(1.15);
        }

        #interactive-orb:active {
            transform: scale(0.9);
        }

        /* The Story Text */
        #message {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 80%;
            min-height: 80px;
            opacity: 1;
            transition: opacity 0.5s ease;
            z-index: 10;
            line-height: 1.4;
        }

        #sub-message {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 20px;
            z-index: 10;
            animation: pulseText 2s infinite;
        }

        /* Step-specific backgrounds */
        body.step-1 { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        body.step-2 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        body.step-3 { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        body.step-4 { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        body.step-5 { background: linear-gradient(135deg, #000000, #434343); }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        .beating {
            animation: beat 1.2s infinite !important;
        }

        .final-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            margin: 0;
            background: -webkit-linear-gradient(#ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(255,117,140,0.3);
        }

        /* Confetti/Particle System */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="message">Hey Almirabel...</div>
    <div id="interactive-orb" onclick="nextStep()">✨</div>
    <div id="sub-message">Tap the spark</div>

    <script>
        let currentStep = 0;
        
        const orb = document.getElementById('interactive-orb');
        const message = document.getElementById('message');
        const subMessage = document.getElementById('sub-message');

        // The story progression
        const steps = [
            {
                emoji: "✨",
                text: "Hey Almirabel...",
                sub: "Tap the spark"
            },
            {
                emoji: "🌱",
                text: "It started with a tiny spark 6 months ago...",
                sub: "Tap again"
            },
            {
                emoji: "🦋",
                text: "Which quickly grew into something beautiful.",
                sub: "Keep tapping"
            },
            {
                emoji: "🧪",
                text: "The chemistry between us was undeniable...",
                sub: "Almost there"
            },
            {
                emoji: "💓",
                text: "And my heart started beating a entirely new way.",
                sub: "One last tap!"
            },
            {
                emoji: "💖",
                text: "<h1 class='final-title'>Happy 6 Months, Almirabel!</h1><p style='font-size:1.2rem; font-weight:300;'>Half a year of amazing moments. Here's to us.</p>",
                sub: ""
            }
        ];

        function nextStep() {
            if (currentStep >= steps.length - 1) {
                // If on final step, just spawn more confetti on tap!
                spawnConfetti();
                return;
            }

            currentStep++;
            
            // Fade out
            message.style.opacity = 0;
            orb.style.opacity = 0;
            subMessage.style.opacity = 0;

            // Change background class
            document.body.className = `step-${currentStep}`;

            // Update content and fade back in after short delay
            setTimeout(() => {
                orb.innerHTML = steps[currentStep].emoji;
                message.innerHTML = steps[currentStep].text;
                subMessage.innerHTML = steps[currentStep].sub;

                // Special behaviors for certain steps
                if (currentStep === 4) {
                    orb.classList.add('beating');
                } else {
                    orb.classList.remove('beating');
                }

                if (currentStep === 5) {
                    orb.classList.add('beating');
                    spawnConfetti();
                    // Keep spawning confetti periodically on the last screen
                    setInterval(spawnConfetti, 2000);
                }

                message.style.opacity = 1;
                orb.style.opacity = 1;
                subMessage.style.opacity = 1;
            }, 500); // 500ms matches the CSS transition time
        }

        function spawnConfetti() {
            const emojis = ['💖', '✨', '🌸', '🥂', '🎉'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Random starting positions and sizes
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.top = '-5vh';
                    particle.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    
                    // Random fall durations
                    const duration = Math.random() * 3 + 2;
                    particle.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(particle);
                    
                    // Cleanup DOM
                    setTimeout(() => {
                        particle.remove();
                    }, duration * 1000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
