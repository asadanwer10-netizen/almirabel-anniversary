<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Almirabel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 1.5s ease-in-out;
            overflow: hidden;
            text-align: center;
        }

        /* The Interactive Centerpiece */
        #interactive-orb {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease, opacity 0.5s ease;
            animation: float 3s ease-in-out infinite;
            z-index: 10;
            margin: 25px 0;
            -webkit-tap-highlight-color: transparent;
        }

        #interactive-orb:hover {
            transform: scale(1.15);
        }

        #interactive-orb:active {
            transform: scale(0.9);
        }

        /* The Story Text */
        #message {
            font-size: 1.3rem;
            font-weight: 300;
            max-width: 85%;
            min-height: 100px;
            opacity: 1;
            transition: opacity 0.5s ease;
            z-index: 10;
            line-height: 1.6;
            padding: 0 15px;
        }

        #sub-message {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 15px;
            z-index: 10;
            animation: pulseText 2s infinite;
            letter-spacing: 1px;
        }

        /* Step-specific backgrounds */
        body.step-1 { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        body.step-2 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        body.step-3 { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        body.step-4 { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        body.step-5 { background: linear-gradient(135deg, #000000, #434343); }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        .beating {
            animation: beat 1.2s infinite !important;
        }

        /* Final Screen Special Styling */
        .final-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            margin: 0;
            background: -webkit-linear-gradient(#ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(255,117,140,0.3);
            line-height: 1.2;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            display: inline-block;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Confetti/Particle System */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="message">Hey Almirabel...</div>
    <div id="interactive-orb" onclick="nextStep()">✨</div>
    <div id="sub-message">Tap the spark</div>

    <script>
        let currentStep = 0;
        
        const orb = document.getElementById('interactive-orb');
        const message = document.getElementById('message');
        const subMessage = document.getElementById('sub-message');

        // The story progression with updated, deeper notes
        const steps = [
            {
                emoji: "✨",
                text: "Hey Almirabel... On November 18, 2025, everything changed.",
                sub: "Tap the spark"
            },
            {
                emoji: "🌱",
                text: "That was the day our story began. Over the last six months, you have become my absolute favorite part of every single day.",
                sub: "Tap again"
            },
            {
                emoji: "🦋",
                text: "From our longest conversations to the quietest moments, every memory we've made is a beautiful treasure I hold close.",
                sub: "Keep tapping"
            },
            {
                emoji: "🧪",
                text: "You brought a completely new kind of magic into my world. With every laugh and every smile, you completely stole my heart.",
                sub: "Almost there"
            },
            {
                emoji: "💓",
                text: "And now, half a year later, I simply can't imagine my life without you in it.",
                sub: "One last tap!"
            },
            {
                emoji: "💖",
                text: "<h1 class='final-title'>Happy 6 Months, Almirabel!</h1><div class='date-badge'>Nov 18, 2025 — Today & Always</div><p style='font-size:1.05rem; font-weight:300; margin-top:10px; line-height: 1.6; max-width: 90%; margin-left: auto; margin-right: auto;'>Thank you for the most amazing half-year of my life. You are my greatest adventure, and I can't wait for all the memories we have yet to make. I love you.</p>",
                sub: ""
            }
        ];

        function nextStep() {
            if (currentStep >= steps.length - 1) {
                // If on final step, spawn more confetti on tap!
                spawnConfetti();
                return;
            }

            currentStep++;
            
            // Fade out
            message.style.opacity = 0;
            orb.style.opacity = 0;
            subMessage.style.opacity = 0;

            // Change background class
            document.body.className = `step-${currentStep}`;

            // Update content and fade back in after short delay
            setTimeout(() => {
                orb.innerHTML = steps[currentStep].emoji;
                message.innerHTML = steps[currentStep].text;
                subMessage.innerHTML = steps[currentStep].sub;

                // Special behaviors for certain steps
                if (currentStep === 4) {
                    orb.classList.add('beating');
                } else {
                    orb.classList.remove('beating');
                }

                if (currentStep === 5) {
                    orb.classList.add('beating');
                    spawnConfetti();
                    // Keep spawning confetti periodically on the last screen
                    setInterval(spawnConfetti, 2500);
                }

                message.style.opacity = 1;
                orb.style.opacity = 1;
                subMessage.style.opacity = 1;
            }, 500); 
        }

        function spawnConfetti() {
            const emojis = ['💖', '✨', '🌸', '🥂', '🎉', '🦋'];
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Random starting positions and sizes
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.top = '-5vh';
                    particle.style.fontSize = (Math.random() * 20 + 12) + 'px';
                    
                    // Random fall durations
                    const duration = Math.random() * 3 + 2.5;
                    particle.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(particle);
                    
                    // Cleanup DOM
                    setTimeout(() => {
                        particle.remove();
                    }, duration * 1000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
